# Netlify site for the admin dashboard. In Netlify: Base directory = frontend/dashboard
# (this file is then picked up). Set env var API_BASE_URL = backend origin,
# e.g. https://ar-passport-api.onrender.com (no /api suffix).
# Optional: AR_SCANNER_URL = scanner site origin (default https://arvrca3.netlify.app/)
# for the "Open AR view" link; the dashboard site has no /ar/ path of its own.
[build]
  publish = "."
  command = "node ../../scripts/write-frontend-env.js ."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/env.js"
  [headers.values]
    Cache-Control = "no-cache"
